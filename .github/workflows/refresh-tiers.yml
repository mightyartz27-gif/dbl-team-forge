name: Refresh PvP tiers

# The official Rating Match tier list changes every season. This light job checks daily and
# commits only when the list changed. If the new list mentions characters that the character data
# doesn't have yet, it also refreshes the character and equipment data in the same run.
on:
  schedule:
    - cron: "30 9 * * *"   # 18:30 JST, just after new seasons start
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: node scripts/ingest/tiers.mjs
      - name: Refresh character data if the tier list mentions new characters
        run: |
          if [ -s .cache/tier-unknown.txt ]; then
            echo "New characters on the tier list: $(tr '\n' ' ' < .cache/tier-unknown.txt)"
            npm ci
            node scripts/ingest/fetch.mjs --refresh
            node scripts/ingest/normalize.mjs
            npm test
          fi
      - name: Commit if anything changed (the Pages deploy runs after this workflow)
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add src/data/generated
          if ! git diff --cached --quiet; then git commit -m "pvp: tier list update $(date -u +%Y-%m-%d)"; git push; fi
